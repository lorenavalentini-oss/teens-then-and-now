<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Teens Then & Now · Smooth Talkers</title>
<style>
  :root{
    --bg:#101522; --panel:#171e2e; --panel2:#20293d; --ink:#f7f8fb; --muted:#aeb8ce;
    --accent:#ffd166; --good:#58d68d; --used:#566070; --line:#303b55; --danger:#ff7b7b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:
    radial-gradient(circle at top,#1b2640 0,#101522 48%,#0a0f19 100%);color:var(--ink);min-height:100vh}
  button{font:inherit}
  .wrap{max-width:1280px;margin:auto;padding:24px}
  .topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:clamp(28px,4vw,54px);letter-spacing:-.03em}
  .brand p{margin:5px 0 0;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer}
  .btn:hover{transform:translateY(-1px)}
  .btn.danger{border-color:#6b3b47;color:#ffd9df}
  .scorebar{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px;margin:18px 0}
  .team{background:rgba(23,30,46,.88);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .team strong{font-size:18px}.score{font-size:30px;font-weight:900;min-width:70px;text-align:center}
  .scorebuttons{display:flex;gap:6px}.scorebuttons button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#263149;color:white;cursor:pointer}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .head{background:#222c43;border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-weight:900;letter-spacing:.05em;font-size:14px}
  .card{min-height:92px;border-radius:16px;border:1px solid #3a4663;background:linear-gradient(160deg,#26334e,#1a2234);color:var(--accent);font-weight:950;font-size:30px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.18);transition:.18s}
  .card:hover{transform:translateY(-3px);border-color:#7183aa}
  .card.used{background:#252b36;color:#7e8797;text-decoration:line-through;opacity:.72}
  .card.video{color:#9ce8ff}
  .footerHint{color:var(--muted);font-size:13px;margin-top:15px;text-align:center}
  dialog{width:min(980px,94vw);max-height:92vh;border:1px solid var(--line);border-radius:22px;background:#121827;color:var(--ink);padding:0;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(3,6,12,.78);backdrop-filter:blur(5px)}
  .modalHead{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#121827;z-index:2}
  .modalHead h2{margin:0;font-size:20px}.x{border:0;background:transparent;color:white;font-size:28px;cursor:pointer}
  .modalBody{padding:22px}
  .imageFallback{
    display:none;
    min-height:180px;
    place-items:center;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:16px;
    margin:0 0 18px;
    padding:24px;
    color:var(--muted);
    background:#171e2e;
    font-weight:800;
  }
  .question{font-size:clamp(24px,3vw,38px);line-height:1.2;margin:0 0 18px;font-weight:900}

  .questionVisual{
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:16px;
    border:1px solid var(--line);
    margin:0 0 18px;
    display:block;
  }

  .choices{display:grid;gap:10px;margin:16px 0}
  .choice{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#1a2234;font-size:18px}
  .reveal{display:none;margin-top:18px;border-left:5px solid var(--good);background:#162b25;padding:16px 18px;border-radius:12px}
  .bonus{margin-top:18px;border:1px solid #4b4267;background:#211d33;padding:16px;border-radius:14px}
  .bonus h3{margin:0 0 8px;color:#d9c3ff}
  .sentence{color:#cabee0;font-style:italic;margin-top:8px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .primary{background:var(--accent);color:#17140a;border:0;font-weight:900}
  .good{background:var(--good);color:#072014;border:0;font-weight:900}
  .videoWrap{aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;background:black;margin:8px 0 16px}
  iframe{width:100%;height:100%;border:0}
  .videoQ{display:grid;gap:10px;margin-top:12px}
  .videoQ .step{background:#192338;border:1px solid var(--line);border-radius:14px;padding:14px}
  .videoQ .step b{color:#9ce8ff}
  .finalBox{text-align:center}
  .finalBox .statement{font-size:clamp(28px,4vw,48px);font-weight:950;margin:10px 0 22px}
  .stance{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stance div{background:#1d273b;border:1px solid var(--line);padding:16px;border-radius:14px;font-weight:800}
  @media(max-width:850px){
    .board{grid-template-columns:repeat(2,1fr)}
    .head{display:none}
    .card::before{content:attr(data-label);display:block;font-size:11px;color:#c7cfdf;letter-spacing:.04em;margin-bottom:4px;text-decoration:none}
    .scorebar{grid-template-columns:1fr}
    .stance{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <h1>TEENS · THEN & NOW</h1>
      <p>Conversation Game · Smooth Talkers · Visual Debate Edition</p>
    </div>
    <div class="controls">
      <button class="btn" onclick="openFinal()">⚡ Final Debate</button>
      <button class="btn danger" onclick="resetGame()">↻ Reset game</button>
    </div>
  </div>
<div class="scorebar">
    <div class="team"><strong>TEAM 1</strong><div class="scorebuttons"><button onclick="score(1,-100)">−</button><span class="score" id="s1">0</span><button onclick="score(1,100)">+</button></div></div>
    <div class="team"><strong>TEAM 2</strong><div class="scorebuttons"><button onclick="score(2,-100)">−</button><span class="score" id="s2">0</span><button onclick="score(2,100)">+</button></div></div>
  </div>

  <div class="board" id="board"></div>
  <div class="footerHint">Once a card is opened, it stays visibly USED when you return to the board. Progress and scores are saved on this device.</div>
</div>

<dialog id="modal">
  <div class="modalHead"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">×</button></div>
  <div class="modalBody" id="modalBody"></div>
</dialog>

<script>
const categories = [
  {key:"communication", label:"COMMUNICATION"},
  {key:"manners", label:"MANNERS"},
  {key:"mental", label:"MENTAL SKILLS"},
  {key:"community", label:"COMMUNITY"},
  {key:"video", label:"VIDEO CHALLENGE"}
];


const cardImages = {
  c100: "communication100.jpg",
  c200: "communication200.jpg",
  c300: "communication300.jpg",
  m100: "manners100.jpg",
  m200: "manners200.jpg",
  m300: "manners300.jpg",
  mns100: "mental100.jpg",
  mns200: "mental200.jpg",
  mns300: "mental300.jpg",
  co100: "community100.jpg",
  co200: "community200.jpg",
  co300: "community300.jpg"
};

const cards = [
  {id:"c100",cat:"communication",pts:100,q:"Which statement is the most balanced?",choices:[
    "A. 1980s teenagers always communicated better.",
    "B. Digital contact has expanded, but phones can reduce face-to-face attention.",
    "C. Texting has destroyed meaningful friendship."
  ],answer:"B",explain:"Technology increases access and speed. The quality of attention depends on how people use it.",
  bonus:"When is a voice note better than a call? When is it worse?",stem:"In my experience… · It depends on… · One example is…"},
  {id:"c200",cat:"communication",pts:200,q:"What does “phubbing” mean?",choices:[
    "A. Ignoring someone beside you to look at your phone.","B. Using formal language in a text.","C. Calling several friends at the same time."
  ],answer:"A",explain:"The word combines “phone” and “snubbing”.",
  bonus:"Is phubbing always rude? Consider an emergency, work and a family meal.",stem:"It could be acceptable if… · I would find it rude when… · The context matters because…"},
  {id:"c300",cat:"communication",pts:300,q:"Which ability is especially important in digital communication?",choices:[
    "A. Reading facial expressions.","B. Managing tone without voice or body language.","C. Taking turns naturally in conversation."
  ],answer:"B",explain:"Written messages remove many non-verbal clues. Wording and punctuation carry more of the tone.",
  bonus:"Create one short message that could sound friendly or angry depending on punctuation.",stem:"The message sounds… · The punctuation suggests… · I would interpret it as…"},

  {id:"m100",cat:"manners",pts:100,q:"Which example shows manners changing rather than disappearing?",choices:[
    "A. People no longer care about anyone.","B. A young person texts before calling because an unexpected call may feel intrusive.","C. Nobody says please or thank you today."
  ],answer:"B",explain:"Checking whether someone is available can itself show consideration.",
  bonus:"Which modern behaviour might seem rude to an older person but polite to a teenager?",stem:"It used to be expected that… · Nowadays… · The difference is…"},
  {id:"m200",cat:"manners",pts:200,q:"What is the best response when expectations differ across generations?",choices:[
    "A. Assume your rules are universal.","B. Avoid people of other ages.","C. Explain preferences and agree on shared rules."
  ],answer:"C",explain:"Clear expectations prevent conflict when social rules differ.",
  bonus:"Create one fair phone rule for a family dinner. Defend it.",stem:"My rule would be… · This is fair because… · An exception could be…"},
  {id:"m300",cat:"manners",pts:300,q:"Which behaviour shows consideration in both eras?",choices:[
    "A. Listening without interrupting.","B. Using exactly the same greeting.","C. Never questioning an older person."
  ],answer:"A",explain:"Greetings change, but attentive listening remains a widely valued interpersonal skill.",
  bonus:"Is interrupting always impolite? Give one reasonable exception.",stem:"Generally speaking… · However… · For instance…"},

  {id:"mns100",cat:"mental",pts:100,q:"Why did many people memorize more phone numbers in the 1980s?",choices:[
    "A. Their brains were naturally stronger.","B. Phones did not usually store personal contacts.","C. Schools tested telephone directories."
  ],answer:"B",explain:"Daily necessity encouraged practice. It does not prove that one generation had a better brain.",
  bonus:"Which information do you no longer memorize because a device stores it?",stem:"I used to remember… · Now I rely on… · This has changed…"},
  {id:"mns200",cat:"mental",pts:200,q:"Using a calculator is most harmful when…",choices:[
    "A. it checks an answer after an estimate.","B. it replaces understanding of the basic operation.","C. it helps solve a realistic complex problem."
  ],answer:"B",explain:"A tool causes problems when it bypasses understanding instead of supporting it.",
  bonus:"Should schools ever ban calculators or AI? In which situations?",stem:"Schools should allow… · They should restrict… · The purpose is to…"},
  {id:"mns300",cat:"mental",pts:300,q:"Which skill may digital life strengthen?",choices:[
    "A. Finding and comparing information from several sources.","B. Remembering every fact without assistance.","C. Maintaining attention without distractions."
  ],answer:"A",explain:"Digital environments can develop information navigation, although source evaluation remains essential.",
  bonus:"Is knowing where to find information as valuable as remembering it?",stem:"Both skills matter because… · The main advantage is… · On the other hand…"},

  {id:"co100",cat:"community",pts:100,q:"Which action combines online and offline participation?",choices:[
    "A. Liking a post and doing nothing else.","B. Organizing volunteers online and joining the local activity.","C. Criticizing a problem anonymously."
  ],answer:"B",explain:"Digital tools can recruit people and coordinate tangible local action.",
  bonus:"Can sharing a campaign online create real change? What else is necessary?",stem:"Online support can… · Real change also requires… · A good example would be…"},
  {id:"co200",cat:"community",pts:200,q:"What does “slacktivism” usually mean?",choices:[
    "A. Low-effort online support that may not produce meaningful action.","B. Volunteering every weekend.","C. Refusing to use technology for activism."
  ],answer:"A",explain:"The term criticizes symbolic online engagement when it replaces more substantial involvement.",
  bonus:"Can a simple like or repost ever be genuinely useful?",stem:"It can help when… · It becomes superficial if… · Its impact depends on…"},
  {id:"co300",cat:"community",pts:300,q:"Which conclusion is best supported by the photo/activity?",choices:[
    "A. Only 1980s teenagers cared about community.","B. Modern teenagers volunteer only to take photos.","C. The tools have changed, but a photo cannot reveal people’s motives."
  ],answer:"C",explain:"A photograph shows observable details. It cannot give direct access to intentions.",
  bonus:"What evidence would you need before judging the teenagers’ motives?",stem:"We can observe… · We cannot assume… · I would need to know…"},

  {id:"v100",cat:"video",pts:100,video:"GGGDfciqyvw",title:"Social Media, Social Life",duration:"3:16",
   vqs:[
     "<b>Catch it:</b> Name one BENEFIT and one PROBLEM the teenagers mention.",
     "<b>Pick a side:</b> Social media makes friendships stronger — agree or disagree?",
     "<b>Make it personal:</b> What is one thing online friends can do better than face-to-face friends — and one thing they cannot?"
   ]},
  {id:"v200",cat:"video",pts:200,video:"ottnH427Fr8",title:"Oversharing & Your Digital Footprint",duration:"3:34",
   vqs:[
     "<b>Spot it:</b> Identify one example of oversharing and one possible consequence.",
     "<b>Judge it:</b> Which is worse: posting too much about yourself or posting about someone else without asking?",
     "<b>Hot take:</b> Should a person have the right to erase EVERYTHING they posted as a teenager?"
   ]},
  {id:"v300",cat:"video",pts:300,video:"UzPMMSKfKZQ",title:"The Importance of Empathy",duration:"3:30",
   vqs:[
     "<b>Understand it:</b> What difference does the video make between sympathy and empathy?",
     "<b>Reality check:</b> Is it easier to misunderstand someone by text than face-to-face? Why?",
     "<b>Challenge:</b> Give one sentence that shows empathy without saying “I understand.”"
   ]},
  {id:"v400",cat:"video",pts:400,video:"zRwt25M5nGw",title:"Don’t Put People in Boxes",duration:"4:24",
   vqs:[
     "<b>Notice it:</b> Find one moment when a label or group division becomes less important.",
     "<b>Test the idea:</b> What stereotype about teenagers is unfair? What stereotype about adults is unfair?",
     "<b>Final clash:</b> Do labels help us understand people or stop us from seeing who they really are?"
   ]}
];

let used = new Set(JSON.parse(localStorage.getItem("ttn_used") || "[]"));
let scores = JSON.parse(localStorage.getItem("ttn_scores") || '{"1":0,"2":0}');

function save(){ localStorage.setItem("ttn_used",JSON.stringify([...used])); localStorage.setItem("ttn_scores",JSON.stringify(scores)); }
function buildBoard(){
  const b=document.getElementById("board"); b.innerHTML="";
  categories.forEach(c=>{ const h=document.createElement("div"); h.className="head"; h.textContent=c.label; b.appendChild(h); });
  [100,200,300,400].forEach(pts=>{
    categories.forEach(cat=>{
      const card=cards.find(x=>x.cat===cat.key && x.pts===pts);
      if(!card){
        const blank=document.createElement("div"); blank.style.minHeight="92px"; b.appendChild(blank); return;
      }
      const btn=document.createElement("button");
      btn.className="card "+(cat.key==="video"?"video ":"")+(used.has(card.id)?"used":"");
      btn.textContent=pts;
      btn.dataset.label=cat.label;
      btn.onclick=()=>openCard(card);
      b.appendChild(btn);
    });
  });
}
function openCard(card){
  used.add(card.id); save(); buildBoard();
  document.getElementById("modalTitle").textContent = card.cat==="video" ? `VIDEO · ${card.pts} POINTS` : `${categories.find(c=>c.key===card.cat).label} · ${card.pts} POINTS`;
  const body=document.getElementById("modalBody");
  if(card.cat==="video"){
    body.innerHTML=`
      <h3 style="font-size:30px;margin:0 0 6px">${card.title}</h3>
      <div style="color:#aeb8ce;margin-bottom:14px">${card.duration} · Watch, catch ideas, then debate.</div>
      <div class="videoWrap"><iframe src="https://www.youtube.com/embed/${card.video}?rel=0" title="${card.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <div class="videoQ">${card.vqs.map((q,i)=>`<div class="step">${i+1}. ${q}</div>`).join("")}</div>
      <div class="bonus"><h3>🔥 Bonus rule</h3>Do not just answer “yes/no”. Give a reason, an example, or challenge another player’s idea politely.</div>
      <div class="actions"><button class="btn good" onclick="closeModal()">✓ Mark played & back to board</button></div>`;
  }else{
    body.innerHTML=`
      <img class="questionVisual" src="${cardImages[card.id]}" alt="${categories.find(c=>c.key===card.cat).label} discussion visual" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="imageFallback">Upload image: <strong>${cardImages[card.id]}</strong></div>
      <div class="question">${card.q}</div>
      <div class="choices">${card.choices.map(x=>`<div class="choice">${x}</div>`).join("")}</div>
      <div class="actions"><button class="btn primary" onclick="document.getElementById('reveal').style.display='block'">Reveal answer</button></div>
      <div class="reveal" id="reveal"><strong>ANSWER ${card.answer}</strong><br>${card.explain}</div>
      <div class="bonus"><h3>🎙 Speaking bonus · up to 100 points</h3><div style="font-size:20px;font-weight:800">${card.bonus}</div><div class="sentence">${card.stem}</div></div>
      <div class="actions"><button class="btn good" onclick="closeModal()">✓ Mark played & back to board</button></div>`;
  }
  document.getElementById("modal").showModal();
}
function closeModal(){ document.getElementById("modal").close(); }
function score(team,delta){ scores[team]=(scores[team]||0)+delta; document.getElementById("s"+team).textContent=scores[team]; save(); }
function renderScores(){ document.getElementById("s1").textContent=scores[1]||0; document.getElementById("s2").textContent=scores[2]||0; }
function resetGame(){
  if(confirm("Reset all used cards and both team scores?")){
    used=new Set(); scores={1:0,2:0}; save(); renderScores(); buildBoard();
  }
}
function openFinal(){
  document.getElementById("modalTitle").textContent="FINAL DEBATE · 45 SECOND CHALLENGE";
  document.getElementById("modalBody").innerHTML=`
    <div class="finalBox">
      <div class="statement">“Teenagers today are not less capable. They are prepared for a different world.”</div>
      <div class="stance"><div>STRONGLY AGREE</div><div>AGREE</div><div>DISAGREE</div><div>STRONGLY DISAGREE</div></div>
      <div class="bonus" style="text-align:left;margin-top:22px"><h3>Your 45-second mission</h3>
      State your position. Use one example from today’s game or videos. Acknowledge a counterargument. Finish with a conclusion.
      <div class="sentence">My main point is… · For instance… · Admittedly… · Nevertheless… · Overall…</div></div>
      <div class="actions" style="justify-content:center"><button class="btn good" onclick="closeModal()">Back to board</button></div>
    </div>`;
  document.getElementById("modal").showModal();
}
buildBoard(); renderScores();
</script>
</body>
</html>
